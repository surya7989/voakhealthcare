name: Voak Health Care CI

on:
  push:
    branches: [ main, 'fix/**', 'feature/**', 'chore/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, json, mbstring, curl, dom, libxml, gd
          coverage: none

      - name: Validate composer.json
        working-directory: ./backend
        run: composer validate --strict

      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check PHP Syntax (lint)
        run: |
          find backend tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run Root Backend Test Suite
        run: php -d memory_limit=512M tests/test_backend_foundation.php

      - name: Run Phase 6 Admin Auth and Security Test Suite
        run: php -d memory_limit=512M tests/test_phase6_admin_auth.php

      - name: Run Phase 7 Website Content Management Test Suite
        run: php -d memory_limit=512M tests/test_phase7_content_management.php

      - name: Run Phase 8 Services Catalog Management Test Suite
        run: php -d memory_limit=512M tests/test_phase8_services_management.php

      - name: Run Phase 9 Industries Management Test Suite
        run: php -d memory_limit=512M tests/test_phase9_industries_management.php

      - name: Run Phase 10 Media & Document Management Test Suite
        run: php -d memory_limit=512M tests/test_phase10_media_and_document_management.php

      - name: Run Phase 11 Contact Enquiries Management Test Suite
        run: php -d memory_limit=512M tests/test_phase11_contact_enquiries_management.php

      - name: Run Phase 12 Proposals & Partnerships Management Test Suite
        run: php -d memory_limit=512M tests/test_phase12_proposals_and_partnerships_management.php

      - name: Run Phase 13 Email Notification & Outbox Telemetry Test Suite
        run: php -d memory_limit=512M tests/test_phase13_email_notification_system.php

      - name: Run Phase 14 Careers & Recruitment Management Test Suite
        run: php -d memory_limit=512M tests/test_phase14_careers_and_recruitment.php

      - name: Run Comprehensive Backend Test Suite
        run: php -d memory_limit=512M backend/tests/run_tests.php

      - name: Verify Secret Scanning Baseline
        run: php tests/scan_secrets.php

      - name: Verify No Local Machine Absolute Paths in Documentation
        run: |
          echo "Verifying no machine-specific absolute file URIs in markdown..."
          ! grep -rnE "file:///[A-Za-z]:/" docs/

  mysql-migration-integration:
    name: MySQL 8.0 Migration Lifecycle
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql-ci-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: voak_staging_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmysql-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: voak_staging_ci
      DB_USERNAME: root
      DB_PASSWORD: mysql-ci-password
      VOAK_MYSQL_TEST: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP with native MySQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json, gd
          coverage: none

      - name: Validate Composer configuration
        working-directory: ./backend
        run: composer validate --strict

      - name: Install Composer dependencies
        working-directory: ./backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check PHP syntax
        run: |
          php -l backend/tests/mysql_migration_integration.php
          php -l backend/tests/mysql_security_concurrency_test.php
          php -l backend/tests/concurrency_worker.php
          php -l backend/src/Database/Migration/MigrationManager.php

      - name: Execute MySQL 8.0 migration lifecycle integration test
        run: php backend/tests/mysql_migration_integration.php

      - name: Verify Phase 0 root compatibility shim against MySQL
        run: |
          php database/migrate.php status | tee migration-status.txt
          grep -E "28 Applied" migration-status.txt
          grep -E "0 Pending" migration-status.txt

      - name: Execute MySQL 8.0 Security Concurrency & Audit Integrity Test
        run: php backend/tests/mysql_security_concurrency_test.php
